# Render Blueprint: Pinata Image API (backend + PostgreSQL)
# Deploy from GitHub: connect this repo in your Render dashboard and use "New > Blueprint".
# Set secret env vars (PINATA_JWT or keys, OPENAI_API_KEY) in the dashboard after creation.

databases:
  - name: pinata-archive-db
    databaseName: pinata_archive
    plan: free  # Use starter or higher for production; free DB expires after 90 days

services:
  # Backend API (Node/Express) – required
  - type: web
    name: pinata-image-api
    runtime: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pinata-archive-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Add these in Render Dashboard (Environment) after first deploy:
      # PINATA_JWT (or PINATA_API_KEY + PINATA_SECRET_API_KEY)
      # OPENAI_API_KEY
      - key: PINATA_JWT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
